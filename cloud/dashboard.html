<title>Sara Career Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column "desk" — a quiet header, a tab rail, then cards per job like an architect's issue register.
   Palette from the brief: white, warm off-white, greys, matte gold, black type. */
:root {
  --bg: #FFFFFF;
  --paper: #F8F6F1;
  --line: #E5E1D8;
  --muted: #6E6A62;
  --ink: #151412;
  --gold: #A3864D;
  --gold-soft: #F0E8D6;
  --ok: #3F6B45;  --ok-soft: #E7F0E6;
  --warn: #8F6B1C; --warn-soft: #F6EDD3;
  --bad: #8E3B34;  --bad-soft: #F5E4E1;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --paper: #1C1B18; --line: #2F2D28; --muted: #A39E93; --ink: #F1EEE7;
    --gold: #C9AA6B; --gold-soft: #2E281C;
    --ok: #8CC08F; --ok-soft: #1E2A1F; --warn: #DDB864; --warn-soft: #2D2717; --bad: #E39A92; --bad-soft: #2E1E1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --paper: #1C1B18; --line: #2F2D28; --muted: #A39E93; --ink: #F1EEE7;
  --gold: #C9AA6B; --gold-soft: #2E281C;
  --ok: #8CC08F; --ok-soft: #1E2A1F; --warn: #DDB864; --warn-soft: #2D2717; --bad: #E39A92; --bad-soft: #2E1E1C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 22px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
  border-bottom: 1px solid var(--line); padding-bottom: 18px; }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
h1 { font: 600 40px/1.05 var(--display); margin: 4px 0 0; text-wrap: balance; }
h2 { font: 600 24px/1.2 var(--display); margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-variant-numeric: tabular-nums; }
.stat b { display: block; font: 600 26px/1 var(--display); }
.stat span { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font: 500 14px var(--sans);
  color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.notice { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.list { display: grid; gap: 14px; }
.job { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.job-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; }
.code { font: 500 12px var(--mono); color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 2px 6px; }
.job-title { font-weight: 600; font-size: 16px; }
.meta { color: var(--muted); font-size: 13px; }
.score { text-align: right; font-variant-numeric: tabular-nums; }
.score b { font: 600 30px/1 var(--display); }
.score small { display: block; font-size: 11px; color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; }
.bar { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--gold); }
.bar .unk { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); opacity: .5; height: 100%; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 22px; }
.cols ul { margin: 4px 0 0; padding-left: 18px; }
.cols li { margin: 2px 0; }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 14px var(--sans); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
a.link { color: var(--gold); text-decoration: none; font-weight: 500; }
a.link:hover { text-decoration: underline; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.s-shortlisted { background: var(--gold-soft); color: var(--gold); }
.s-approved, .s-applying { background: var(--warn-soft); color: var(--warn); }
.s-applied { background: var(--ok-soft); color: var(--ok); }
.s-needs_you, .s-failed { background: var(--bad-soft); color: var(--bad); }
.s-skipped, .s-dismissed { background: var(--paper); color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--paper); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
select, input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.draft { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; min-width: 0; }
.draft p { margin: 0; white-space: pre-wrap; }
.quote { background: var(--paper); border-radius: 8px; padding: 10px 12px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .track { height: 10px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--gold); border-radius: 0 4px 4px 0; }
.bar-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--paper); border-radius: 10px; padding: 14px 16px; }
.kpi b { display: block; font: 600 28px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.pack { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
form.grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
form.grid label.wide { grid-column: 1 / -1; }
form.grid textarea { min-height: 120px; font: inherit; }
.prose { max-width: 70ch; }
.prose p { margin: 6px 0; }
.hint { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: 14px; }
@media (max-width: 560px) {
  h1 { font-size: 32px; }
  .job-head { grid-template-columns: auto 1fr; }
  .score { grid-column: 1 / -1; text-align: left; display: flex; gap: 8px; align-items: baseline; }
  .score small { display: inline; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Executive career desk · GCC</div>
      <h1>Sara Saher El-Khoreby</h1>
      <p class="sub" id="lede">Head of Design Management Operations &amp; Technical Office. Daily shortlist at 9 AM Cairo time, growth report Mondays at 7 PM.</p>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <main id="view" aria-live="polite">
    <div class="notice">Loading your desk…</div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const DAILY_CAP = 5;
  const TABS = [
    ["today", "Today"], ["pipeline", "Pipeline"], ["content", "Content"], ["engagement", "Engagement"], ["recruiters", "Recruiters"], ["growth", "Growth"], ["analytics", "Analytics"], ["activity", "Activity"],
  ];
  const STATUS_LABEL = {
    shortlisted: "Shortlisted", approved: "Approved to apply", applying: "Applying", applied: "Applied",
    needs_you: "Needs you", skipped: "Skipped", dismissed: "Dismissed", failed: "Failed",
  };
  const DIMENSIONS = {
    experience: "Experience", seniority: "Seniority", sector: "Sector", geography: "Location",
    leadership: "Leadership", technical: "Technical", qualifications: "Qualifications", progression: "Progression",
  };
  const S = { db: null, owner: false, tab: "today", jobs: [], engagement: [], reports: [], runs: [], metrics: [],
              profile: null, packs: {}, content: [], finds: [], recruiters: null, downloads: null, filter: { status: "", country: "" }, ready: false };

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const today = () => new Date().toISOString().slice(0, 10);
  const safeUrl = (u) => (typeof u === "string" && /^https:\/\//i.test(u)) ? u : null;
  const place = (j) => [j.city, j.country].filter(Boolean).join(", ");
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
  }
  async function copy(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done || "Copied"); }
    catch { toast("Copy was blocked. Select the text and copy it manually."); return false; }
    return true;
  }
  const pill = (status) => h("span", { class: "pill s-" + status }, STATUS_LABEL[status] || status);

  // ---------- data writes (one per action) ----------
  async function setStatus(job, status, note) {
    if (!S.db || !S.owner) return;
    const history = Array.isArray(job.history) ? job.history.slice() : [];
    history.push({ at: new Date().toISOString(), event: status, note: note || "" });
    try {
      await S.db.doc("jobs/" + job.id).update({ status, updated_at: new Date().toISOString(), history });
      toast(STATUS_LABEL[status] + ": " + (job.code || job.id));
    } catch (e) { toast("Could not save (" + (e && e.code || "error") + "). Try again."); }
  }

  // ---------- views ----------
  function renderStats() {
    const box = document.getElementById("stats");
    const c = (st) => S.jobs.filter((j) => j.status === st).length;
    const appliedToday = S.jobs.filter((j) => j.status === "applied" && (j.applied_at || "").slice(0, 10) === today()).length;
    box.replaceChildren(
      h("div", { class: "stat" }, h("b", {}, c("shortlisted")), h("span", {}, "waiting for you")),
      h("div", { class: "stat" }, h("b", {}, c("approved") + c("applying")), h("span", {}, "approved to apply")),
      h("div", { class: "stat" }, h("b", {}, c("applied")), h("span", {}, "applied")),
      h("div", { class: "stat" }, h("b", {}, appliedToday + "/" + DAILY_CAP), h("span", {}, "applied today")),
    );
  }

  function renderTabs() {
    const nav = document.getElementById("tabs");
    nav.replaceChildren(...TABS.map(([key, label]) => h("button", {
      role: "tab", "aria-selected": String(S.tab === key), id: "tab-" + key,
      onclick: () => { S.tab = key; try { history.replaceState(null, "", "#" + key); } catch {} render(); },
    }, label)));
  }

  function breakdown(job) {
    const rows = Array.isArray(job.breakdown) ? job.breakdown : [];
    if (!rows.length) return null;
    return h("div", { class: "bars" }, rows.map((r) => {
      const known = typeof r.score === "number";
      return h("div", { class: "bar", title: [r.evidence, r.vacancy_quote].filter(Boolean).join(" · ") },
        h("span", {}, (DIMENSIONS[r.dimension] || r.dimension) + (r.weight ? " · " + r.weight + "%" : "")),
        h("span", { class: "meta" }, known ? r.score : "?"),
        h("div", { class: "track" }, known ? h("div", { class: "fill", style: "width:" + Math.max(0, Math.min(100, r.score)) + "%" })
                                            : h("div", { class: "unk" })));
    }));
  }

  function jobCard(job, actions) {
    const url = safeUrl(job.url);
    const list = (title, items) => (Array.isArray(items) && items.length)
      ? h("div", {}, h("div", { class: "label" }, title), h("ul", {}, items.map((x) => h("li", {}, x)))) : null;
    return h("article", { class: "job" },
      h("div", { class: "job-head" },
        h("span", { class: "code" }, job.code || job.id),
        h("div", { style: "min-width:0" },
          h("div", { class: "job-title" }, job.title || "Untitled vacancy"),
          h("div", { class: "meta" }, [job.employer, place(job), job.posted ? "posted " + job.posted : null, job.source].filter(Boolean).join(" · "))),
        h("div", { class: "score" }, h("b", {}, typeof job.match === "number" ? job.match + "%" : "–"),
          h("small", {}, job.confidence ? job.confidence + " confidence" : "match"))),
      breakdown(job),
      h("div", { class: "cols" }, list("Why it fits", job.reasons), list("Gaps", job.gaps), list("Not stated in the advert", job.unknowns)),
      job.flags && job.flags.length ? h("div", { class: "notice warn" }, job.flags.join(" · ")) : null,
      packBox(job),
      h("div", { class: "row" },
        pill(job.status || "shortlisted"),
        job.apply_method ? h("span", { class: "pill s-skipped" }, METHOD_LABEL[job.apply_method] || job.apply_method)
          : (job.easy_apply ? h("span", { class: "pill s-skipped" }, "Easy Apply") : null),
        url ? h("a", { class: "link", href: url, target: "_blank", rel: "noopener noreferrer" }, "Open job ↗") : null,
        h("span", { style: "flex:1" }),
        ...actions));
  }

  const METHOD_LABEL = {
    linkedin_easy_apply: "LinkedIn Easy Apply", workable_form: "Workable form (no account)",
    company_portal: "Company portal (login needed)", email: "Apply by email", unknown: "Apply method not confirmed",
  };

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function loadPack(job) {
    if (S.packs[job.id]) return S.packs[job.id];
    const snap = await S.db.doc("packs/" + job.id).get();
    S.packs[job.id] = snap.exists ? snap.data() : null;
    return S.packs[job.id];
  }

  async function saveFile(job, file) {
    if (!S.downloads) { toast("Downloads are not available in this view."); return; }
    try {
      await S.downloads.save({ filename: file.filename, data: b64ToBytes(file.b64) });
    } catch (e) {
      if (e && e.code !== "declined") toast("Could not save the file (" + (e.code || "error") + ").");
    }
  }

  function packBox(job) {
    if (!job.pack_ready) return null;
    const box = h("div", { class: "pack" }, h("div", { class: "label" }, "Application pack"),
      h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: async (e) => {
        e.target.disabled = true;
        try {
          const pack = await loadPack(job);
          if (!pack) { toast("Pack not found."); return; }
          const row = e.target.parentElement;
          row.replaceChildren(
            ...pack.files.map((f) => h("button", { class: "btn ghost", onclick: () => saveFile(job, f) }, "⬇ " + f.kind)),
            h("button", { class: "btn ghost", onclick: () => copy(pack.letter_text || "", "Cover letter copied") }, "Copy cover letter text"));
        } catch (err) { toast("Could not load the pack (" + (err && err.code || "error") + ")."); e.target.disabled = false; }
      } }, "Show CV and cover letter")));
    return box;
  }

  function actionsFor(job) {
    if (!S.owner) return [];
    const st = job.status || "shortlisted";
    const b = (label, cls, fn) => h("button", { class: "btn " + cls, onclick: fn }, label);
    if (st === "shortlisted") return [
      b("Skip", "ghost", () => setStatus(job, "skipped")),
      b("Approve & apply", "gold", () => setStatus(job, "approved", "approved on dashboard")),
    ];
    if (st === "approved" || st === "applying") return [
      b("Undo", "ghost", () => setStatus(job, "shortlisted", "approval withdrawn")),
      b("Needs you", "ghost", () => setStatus(job, "needs_you", "marked by the apply task or by you")),
      b("Mark applied", "", () => setStatus(job, "applied", "marked on dashboard")),
    ];
    if (st === "needs_you" || st === "failed") return [
      b("Dismiss", "ghost", () => setStatus(job, "dismissed")),
      b("Mark applied", "", () => setStatus(job, "applied", "applied manually")),
    ];
    return [];
  }

  const DESK_URL = "https://claude.ai/artifact/YHCwoZk1vSTyqTvgLqgBXP";

  function factsBlock() {
    const p = S.profile || {};
    const id = p.identity || {};
    const m = p.headline_metrics || {};
    return [
      "VERIFIED FACTS (the only answers you may give; never invent or estimate anything):",
      `- Name: ${id.name || ""} · Email: ${id.email || ""} · Phone: ${id.phone || ""} · Location: ${id.base || ""}, ready to relocate`,
      "- Current title: Head of Design Management Operations & Technical Office, MENA Development & Real Estate Investment (Riyadh; remote), since Aug 2023",
      `- Total experience: ${m.years_experience || ""} years · Management: ${m.years_management || ""} years · Nationality: ${id.nationality || ""}`,
      "- Visa: requires employer sponsorship · Availability: as soon as visa and residency procedures are completed",
      "- Salary question: \"Negotiable, in line with the role scope and local market\" (if a number is required, the application is NEEDS YOU)",
      "- Education: Ph.D. candidate, Mansoura University (expected 2027); M.Sc. Architecture, Tanta University (2015); B.Sc. Architectural Engineering, Mansoura University (2005)",
      "- Languages: Arabic (native), English (professional fluency)",
      "- Saudi Council of Engineers: not registered, eligible",
    ].join("\n");
  }

  const APPLY_RULES = [
    "HOW TO APPLY, by the job's apply method:",
    "- LinkedIn Easy Apply: use the résumé already saved in my LinkedIn account.",
    "- Workable form or another public form with no account: fill it from the verified facts; attach my tailored CV for that job (download it on the dashboard with \"Show CV and cover letter\" → CV (PDF), then upload it from Downloads). If the upload does not work, do not submit: NEEDS YOU.",
    "- Company portal that needs an account (GulfTalent, Workday, Taleo, SuccessFactors, Oracle): only if I am already signed in to it in this browser. Never create an account and never type a password. Otherwise NEEDS YOU.",
    "- Link to a copy on another site (aggregator): find the original posting first; if you cannot, NEEDS YOU.",
    "",
    "RULES:",
    `1. At most ${DAILY_CAP} submitted applications per day, one at a time, at a normal human pace.`,
    "2. If any question cannot be answered from the verified facts, do NOT submit that application: NEEDS YOU, with the question text.",
    "3. Stop that application at any CAPTCHA, sign-in prompt, identity or security check: NEEDS YOU.",
    "4. Never message, follow, connect, like, comment or post anything.",
    "5. After each job, go back to the Career Desk page and click its button: \"Mark applied\" if submitted, \"Needs you\" otherwise.",
    "6. At the end, give me a list: each job code with APPLIED, NEEDS YOU (with the reason or question) or FAILED (with the reason).",
  ].join("\n");

  function applyPrompt(approved) {
    const lines = approved.slice(0, DAILY_CAP).map((j) => `- ${j.code}: ${j.title} — ${j.employer} (${place(j)}) · apply method: ${METHOD_LABEL[j.apply_method] || "not checked"} · ${j.url || ""}`);
    return ["Apply to these jobs I approved, in your browser, where I am signed in.", `Career Desk page: ${DESK_URL} (Today tab).`, "", ...lines, "",
            factsBlock(), "", APPLY_RULES].join("\n");
  }

  function standingTask() {
    return ["DAILY AUTO-APPLY (run every day at 10:00 AM Cairo time).",
      `1. Open my Career Desk page in your browser: ${DESK_URL} and go to the Today tab.`,
      "2. Read the section \"Approved to apply\". If it lists no jobs, stop and report \"Nothing to apply today\".",
      "3. For each listed job (at most " + DAILY_CAP + "), open its job link and apply as described below.",
      "", factsBlock(), "", APPLY_RULES].join("\n");
  }

  const SEARCH_TITLES = ["Design Manager", "Senior Design Manager", "Head of Design Management", "Head of Technical Office",
    "Technical Office Manager", "Design & Development Manager", "Development Manager", "Owner's Representative", "Interior Design Manager"];
  const SEARCH_PLACES = ["Saudi Arabia", "United Arab Emirates", "Qatar", "Kuwait", "Bahrain", "Oman"];
  const FIND_CAP = 15;
  const linkedinJobId = (u) => { const m = /^https:\/\/(?:[a-z]{2,3}\.)?(?:www\.)?linkedin\.com\/jobs\/view\/(?:[^/?#]*?-)?(\d{6,})\/?(?:[?#].*)?$/i.exec(String(u || "").trim()); return m ? m[1] : null; };

  function searchTask() {
    return ["DAILY LINKEDIN EASY APPLY SEARCH (run every day at 8:30 AM Cairo time, before the 9:20 AM scout).",
      "Use your browser, where I am already signed in to LinkedIn. Only read job listings; never apply, message, follow, connect, like, comment or post in this task.",
      "1. Open LinkedIn Jobs. For each search title below, search in Saudi Arabia and the United Arab Emirates first, then Qatar, Kuwait, Bahrain and Oman, then Remote,",
      "   with the filters \"Easy Apply\" ON and \"Date posted: Past week\". Titles: " + SEARCH_TITLES.join("; ") + ".",
      "2. Keep only jobs that show the \"Easy Apply\" button (not \"Apply\" to an external site). Skip roles below manager level, Egypt on-site roles,",
      "   and jobs outside design management, technical office, development, project or real-estate work. Skip anything asking for fees or WhatsApp contact.",
      `3. For each kept job (at most ${FIND_CAP} per day, best fits first), open my Career Desk page: ${DESK_URL}, Today tab, section "Add a LinkedIn Easy Apply job",`,
      "   and fill the form: title, company, city, country, posted date, the job link (https://www.linkedin.com/jobs/view/<number>/ with nothing after it),",
      "   and paste the full job description text from the job page. Click \"Add job\". If the desk says it is already there, move on.",
      "4. Stop at any CAPTCHA, sign-in prompt or security check and tell me. Work at a normal human pace; do not page through more than the first 2 result pages per search.",
      "5. At the end, report how many jobs you added and how many you skipped (with the reason)."].join("\n");
  }

  function findForm() {
    const form = h("form", { class: "grid", id: "find-form", onsubmit: async (e) => {
      e.preventDefault();
      if (!S.db || !S.owner) return;
      const fd = new FormData(e.target);
      const v = (k) => String(fd.get(k) || "").trim();
      const id = linkedinJobId(v("url"));
      if (!id) { toast("Use a LinkedIn job link: https://www.linkedin.com/jobs/view/<number>/"); return; }
      const url = "https://www.linkedin.com/jobs/view/" + id + "/";
      if (S.finds.some((f) => f.id === "LI-" + id) || S.jobs.some((j) => linkedinJobId(j.url) === id)) { toast("Already on the desk"); return; }
      const body = { linkedin_job_id: id, url, title: v("title").slice(0, 200), employer: v("employer").slice(0, 200) || "Employer not stated",
        city: v("city").slice(0, 100), country: v("country").slice(0, 100), posted: v("posted") || null,
        description: v("description").slice(0, 20000), easy_apply: true, apply_method: "linkedin_easy_apply",
        status: "new", found_at: new Date().toISOString(), source: "linkedin easy apply search (desktop app)" };
      if (!body.title) { toast("Add the job title"); return; }
      try { await S.db.doc("finds/LI-" + id).set(body); toast("Added: " + body.title); e.target.reset(); }
      catch (err) { toast("Could not save (" + (err && err.code || "error") + ")."); }
    } },
      h("label", {}, "Job title", h("input", { name: "title", id: "find-title", required: true })),
      h("label", {}, "Company", h("input", { name: "employer", id: "find-employer" })),
      h("label", {}, "City", h("input", { name: "city", id: "find-city" })),
      h("label", {}, "Country", h("input", { name: "country", id: "find-country" })),
      h("label", {}, "Posted", h("input", { type: "date", name: "posted", id: "find-posted" })),
      h("label", { class: "wide" }, "LinkedIn job link", h("input", { name: "url", id: "find-url", type: "url", required: true, placeholder: "https://www.linkedin.com/jobs/view/1234567890/" })),
      h("label", { class: "wide" }, "Job description (paste the full text)", h("textarea", { name: "description", id: "find-description", required: true })),
      h("button", { class: "btn", type: "submit", disabled: !S.owner }, "Add job"));

      h("h3", {}, "Add a LinkedIn Easy Apply job"),
      h("p", { class: "hint" }, "Job Scout keeps LinkedIn Easy Apply jobs only. Set this up once: in the Claude desktop app, create a scheduled task that runs every day at 8:30 AM "

        + "You can also add one yourself."),

  }

  function viewToday() {
    const shortlist = S.jobs.filter((j) => (j.status || "shortlisted") === "shortlisted")
      .sort((a, b) => (b.match || 0) - (a.match || 0));
    const approvedAll = S.jobs.filter((j) => j.status === "approved");
    const lastScout = S.runs.find((r) => r.type === "scout");
    const parts = [];
    parts.push(h("section", { class: "notice" },
      h("h2", {}, "Today’s shortlist"),
      h("p", { class: "sub" }, lastScout ? `Last scout run ${String(lastScout.at || "").replace("T", " ").slice(0, 16)} UTC: ${lastScout.summary || ""}`

    parts.push(h("section", { class: "draft" },
      h("h3", {}, "Automatic applying"),
      h("p", { class: "hint" }, "Set this up once: in the Claude desktop app, create a scheduled task that runs every day at 10:00 AM and paste this text as its instructions. "
        + "Each day it applies to every job in “Approved to apply” below (at most " + DAILY_CAP + "), then marks each one here. To apply right away, use “Copy apply instructions” in a new task instead."),
      h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: () => copy(standingTask(), "Daily auto-apply task copied") }, "Copy daily auto-apply task"))));
    if (approvedAll.length) {
      const prompt = applyPrompt(approvedAll);
      parts.push(h("section", { class: "draft" },
        h("h3", {}, `Approved to apply (${approvedAll.length})`),
        h("p", { class: "hint" }, "These are applied to by the daily task, or now with the instructions below."),

  const POST_LABEL = { draft: "Draft", approved: "Approved", posted: "Posted", skipped: "Skipped" };

  async function setPostStatus(week, postId, status) {
    if (!S.db || !S.owner) return;
    const posts = (week.posts || []).map((p) => p.id === postId
      ? { ...p, status, [status + "_at"]: new Date().toISOString() } : p);
    try { await S.db.doc("content/" + week.id).update({ posts }); toast(POST_LABEL[status] + ": " + postId); }
    catch (e) { toast("Could not save (" + (e && e.code || "error") + ")."); }
  }

    const weeks = S.content.filter((w) => Array.isArray(w.posts) && w.posts.length);
    if (!weeks.length) return [h("div", { class: "notice" }, "Post drafts appear here: three a week, drafted every Monday evening from your verified experience.")];
    const b = (label, cls, fn) => h("button", { class: "btn " + cls, onclick: fn }, label);
    const ready = weeks.flatMap((w) => w.posts.filter((p) => p.status === "approved"));
    const next = ready[0];
    const postingPrompt = next ? [
      "Publish one LinkedIn post for me, in your browser, where I am signed in to LinkedIn.",
      "",
      "1. Open https://www.linkedin.com/feed/ and click \"Start a post\".",
      "2. Paste the text between the lines below EXACTLY as written. Do not change, shorten, translate, add or remove anything (no extra hashtags, emojis, mentions or links).",
      "3. Visibility: Anyone. Do not add images, polls, documents or tags.",
      "4. Click Post once. Then open the published post and tell me its URL.",
      "5. If LinkedIn asks me to sign in, shows a CAPTCHA or a security check, or the text looks different after pasting, stop and tell me. Do not retry.",

      "----- END -----",
    ].join("\n") : "";
    return [

        h("h3", {}, `Next approved post: ${next.id} · ${next.title || ""}`),
        h("p", { class: "hint" }, `Suggested time: ${[next.day, next.time].filter(Boolean).join(", ")}. Open the Claude desktop app, start a new task, paste the instructions, and let it post in its browser. `
          + "One post per task. When it gives you the post link, tap Mark posted below."),
        h("div", { class: "row" }, h("button", { class: "btn gold", onclick: () => copy(postingPrompt, "Posting instructions copied") }, "Copy posting instructions"))) : null,
      ...weeks.map((w) => h("section", { class: "list" },
        h("h2", {}, "Week of " + w.week),
        ...w.posts.map((p) => {
          const st = p.status || "draft";
          const actions = !S.owner ? [] : st === "draft" ? [b("Skip", "ghost", () => setPostStatus(w, p.id, "skipped")), b("Approve", "gold", () => setPostStatus(w, p.id, "approved"))]
            : st === "approved" ? [b("Back to draft", "ghost", () => setPostStatus(w, p.id, "draft")), b("Mark posted", "", () => setPostStatus(w, p.id, "posted"))]

            h("p", { class: "meta" }, [p.day, p.time, p.pillar, p.format].filter(Boolean).join(" · ")),

  // ---------- recruiters ----------
  const R_STATUS = { not_contacted: "Not contacted", registered: "CV registered", contacted: "Contacted", replied: "Replied",
                     in_process: "In process", not_now: "Not now" };

  async function saveRecruiters(items, msg) {
    if (!S.db || !S.owner) return;
    try { await S.db.doc("directory/recruiters").update({ items, updated_at: new Date().toISOString() }); toast(msg || "Saved"); }
    catch (e) { toast("Could not save (" + (e && e.code || "error") + ")."); }
  }

  // ---------- analytics ----------
  function bars(title, pairs) {
    const max = Math.max(1, ...pairs.map(([, n]) => n));
    return h("section", { class: "draft" }, h("h3", {}, title),
      pairs.length ? pairs.map(([label, n]) => h("div", { class: "bar-row", title: label + ": " + n },
        h("span", {}, label), h("div", { class: "track" }, h("div", { class: "fill", style: "width:" + (n / max * 100) + "%" })), h("b", {}, n)))
        : h("p", { class: "meta" }, "No data yet."));
  }

  function viewAnalytics() {
    const J = S.jobs;
    const st = (x) => J.filter((j) => (j.status || "shortlisted") === x).length;
    const decided = J.filter((j) => ["shortlisted", "approved", "applying", "applied", "needs_you", "dismissed", "failed"].includes(j.status || "shortlisted"));
    const applied = st("applied");
    const approved = J.filter((j) => ["approved", "applying", "applied", "needs_you", "failed"].includes(j.status)).length;
    const scored = J.filter((j) => typeof j.match === "number");
    const avg = scored.length ? Math.round(scored.reduce((a, j) => a + j.match, 0) / scored.length) : null;
    const posts = S.content.flatMap((w) => w.posts || []);
    const recs = (S.recruiters && S.recruiters.items) || [];
    const count = (arr, key) => Object.entries(arr.reduce((m, x) => { const k = key(x) || "Not stated"; m[k] = (m[k] || 0) + 1; return m; }, {}))
      .sort((a, b) => b[1] - a[1]);
    const m = S.metrics.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const delta = (i, k) => (i > 0 && m[i][k] != null && m[i - 1][k] != null) ? (m[i][k] - m[i - 1][k]) : null;
    const fmtDelta = (d) => d == null ? "" : (d > 0 ? " (+" + d + ")" : d < 0 ? " (" + d + ")" : " (0)");
    return [
      h("div", { class: "kpis" },
        h("div", { class: "kpi" }, h("b", {}, J.length), h("span", {}, "jobs found")),
        h("div", { class: "kpi" }, h("b", {}, decided.length), h("span", {}, "shortlisted by the scout")),
        h("div", { class: "kpi" }, h("b", {}, approved), h("span", {}, "approved by you")),
        h("div", { class: "kpi" }, h("b", {}, applied), h("span", {}, "applications sent")),
        h("div", { class: "kpi" }, h("b", {}, avg == null ? "–" : avg + "%"), h("span", {}, "average match")),
        h("div", { class: "kpi" }, h("b", {}, posts.filter((p) => p.status === "posted").length + " / " + posts.length), h("span", {}, "posts published / drafted")),
        h("div", { class: "kpi" }, h("b", {}, recs.filter((r) => ["contacted", "replied", "in_process", "registered"].includes(r.status)).length + " / " + recs.length), h("span", {}, "recruiters engaged"))),
      bars("Pipeline by status", Object.keys(STATUS_LABEL).map((k) => [STATUS_LABEL[k], st(k)]).filter(([, n]) => n > 0)),
      bars("Jobs by country", count(J, (j) => j.country)),
      bars("Jobs by employer", count(J, (j) => j.employer).slice(0, 8)),
      bars("How to apply", count(J, (j) => METHOD_LABEL[j.apply_method] || (j.easy_apply ? "LinkedIn Easy Apply" : "Not checked yet"))),
      h("section", { class: "draft" }, h("h3", {}, "LinkedIn numbers, week on week"),
        m.length ? h("div", { class: "table-wrap" }, h("table", {},
          h("thead", {}, h("tr", {}, ["Week", "Viewers", "Impressions", "Searches", "Followers"].map((t) => h("th", {}, t)))),
          h("tbody", {}, m.map((r, i) => h("tr", {}, h("td", {}, r.date),
            ...["profile_views", "post_impressions", "search_appearances", "followers"].map((k) => h("td", {}, (r[k] ?? "–") + fmtDelta(delta(i, k)))))))))
          : h("p", { class: "meta" }, "Save your weekly LinkedIn numbers in the Growth tab to see the trend here.")),
    ];
  }

      h("label", {}, "Profile viewers", h("input", { type: "number", min: "0", name: "views", id: "m-views" })),
      h("label", {}, "Post impressions", h("input", { type: "number", min: "0", name: "impr", id: "m-impr" })),
      h("label", {}, "Search appearances", h("input", { type: "number", min: "0", name: "search", id: "m-search" })),
      h("label", {}, "Followers", h("input", { type: "number", min: "0", name: "followers", id: "m-followers" })),
      h("button", { class: "btn", type: "submit", disabled: !S.owner }, "Save numbers"));
    const recent = S.metrics.slice(0, 8);
    return [
      h("section", { class: "draft" }, h("h3", {}, "This week’s LinkedIn numbers"),
        h("p", { class: "hint" }, "Copy them from LinkedIn → your profile → Analytics before Monday 7 PM. The report compares week on week."), form,
        recent.length ? h("div", { class: "table-wrap" }, h("table", {},
          h("thead", {}, h("tr", {}, ["Week", "Viewers", "Impressions", "Searches", "Followers"].map((t) => h("th", {}, t)))),
          h("tbody", {}, recent.map((r) => h("tr", {}, [r.date, r.profile_views, r.post_impressions, r.search_appearances, r.followers]
            .map((v) => h("td", {}, v ?? "–"))))))) : null),
      report ? h("section", { class: "draft prose" },
        h("h3", {}, "Growth report · " + (report.date || "")),
        report.summary ? h("p", {}, report.summary) : null,
        Array.isArray(report.actions) && report.actions.length ? h("div", {}, h("div", { class: "label" }, "Three actions this week"),
          h("ol", {}, report.actions.map((a) => h("li", {}, a)))) : null,
        report.makeover ? h("details", {}, h("summary", {}, "Profile makeover drafts"),
          ...Object.entries(report.makeover).map(([k, v]) => h("div", { class: "draft" }, h("div", { class: "label" }, k.replace(/_/g, " ")),
            h("p", { dir: "auto" }, Array.isArray(v) ? v.join("\n") : String(v)),
            h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: () => copy(Array.isArray(v) ? v.join("\n") : String(v)) }, "Copy"))))) : null)
        : h("div", { class: "notice" }, "The first report arrives Monday at 7 PM, with a full profile makeover (headline options, About in English and Arabic, skills)."),
    ];
  }

  function viewActivity() {
    return [h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["When (UTC)", "Run", "Result"].map((t) => h("th", {}, t)))),
      h("tbody", {}, S.runs.length ? S.runs.map((r) => h("tr", {}, h("td", { class: "meta" }, String(r.at || "").replace("T", " ").slice(0, 16)),
        h("td", {}, r.type || ""), h("td", {}, r.summary || "")))
        : h("tr", {}, h("td", { colspan: "3", class: "meta" }, "No runs yet."))))),
      h("p", { class: "hint" }, "Easy Apply search: daily 8:30 AM (desktop app) · Scout: daily 9:20 AM Cairo · Growth report: Mondays 7 PM Cairo · Applications: when you run the copied instructions in the Claude desktop app.")];
  }

  function render() {
    renderTabs();
    renderStats();
    const view = document.getElementById("view");
    if (!S.db) {
      view.replaceChildren(h("div", { class: "notice" }, "This desk needs Claude’s private storage. Open it while signed in to claude.ai."));
      return;
    }
    const views = { today: viewToday, pipeline: viewPipeline, content: viewContent, recruiters: viewRecruiters, analytics: viewAnalytics, engagement: viewEngagement, growth: viewGrowth, activity: viewActivity };
    const content = (views[S.tab] || viewToday)();
    if (!S.owner) content.unshift(h("div", { class: "notice warn" }, "Read-only view. Only the owner can approve jobs or save numbers."));
    // Keep unsent form text when live data re-renders the page.
    const kept = [...view.querySelectorAll("form input[id], form textarea[id], form select[id]")].filter((el) => el.value && el.value !== el.defaultValue).map((el) => [el.id, el.value]);
    view.replaceChildren(...[].concat(content).filter(Boolean));
    for (const [id, value] of kept) { const el = document.getElementById(id); if (el) el.value = value; }
  }

  // ---------- boot ----------
  const hash = (location.hash || "").slice(1);
  if (TABS.some(([k]) => k === hash)) S.tab = hash;
  render();

  (async () => {
    const claude = window.claude;
    if (!claude || !claude.use) { render(); return; }
    const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    S.downloads = downloads;
    S.db = db;
    S.owner = user ? await user.isOwner() : false;
    if (!db) { render(); return; }
    const onErr = (e) => toast("Live updates stopped (" + (e && e.code || "error") + "). Reload the page.");
    const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    db.collection("jobs").onSnapshot((s) => { S.jobs = docs(s); render(); }, onErr);
    db.collection("engagement").orderBy("date", "desc").limit(7).onSnapshot((s) => { S.engagement = docs(s); render(); }, onErr);
    db.collection("reports").orderBy("date", "desc").limit(12).onSnapshot((s) => { S.reports = docs(s); render(); }, onErr);
    db.collection("runs").orderBy("at", "desc").limit(30).onSnapshot((s) => { S.runs = docs(s); render(); }, onErr);
    db.collection("content").orderBy("week", "asc").onSnapshot((s) => { S.content = docs(s); render(); }, onErr);
    db.doc("directory/recruiters").onSnapshot((d) => { S.recruiters = d.exists ? d.data() : null; render(); }, onErr);
    db.collection("finds").orderBy("found_at", "desc").limit(60).onSnapshot((s) => { S.finds = docs(s); render(); }, onErr);
    db.collection("metrics").orderBy("date", "desc").limit(26).onSnapshot((s) => { S.metrics = docs(s); render(); }, onErr);
    db.doc("config/profile").onSnapshot((d) => { S.profile = d.exists ? d.data() : null; }, onErr);
  })();
})();
</script>
